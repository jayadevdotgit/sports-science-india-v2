<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="100%" height="100%" role="img" aria-labelledby="title desc" style="overflow:visible">
  <title id="title">VIVI, the Red Panda Mascot</title>
  <desc id="desc">An interactive red panda mascot with animated features.</desc>

  <defs>
