    <path d="M93 137 C94 54 266 54 267 137" fill="none" stroke="#4B4B52" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <rect x="72" y="118" width="34" height="65" rx="16" fill="#17171B" stroke="#08080A" stroke-width="4"/>
