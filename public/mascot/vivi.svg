    <linearGradient id="kibo-fur" x1="92" y1="72" x2="256" y2="218" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9B24"/>
      <stop offset="0.5" stop-color="#F46A19"/>
      <stop offset="1" stop-color="#C63A16"/>
    </linearGradient>
    <linearGradient id="kibo-hoodie" x1="180" y1="194" x2="180" y2="342" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A2A2E"/>
      <stop offset="1" stop-color="#0B0B0D"/>
