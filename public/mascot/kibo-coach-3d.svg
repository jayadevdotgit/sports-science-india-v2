<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" role="img" aria-labelledby="title desc" style="overflow:visible">
  <title id="title">VIVI, the Red Panda Mascot</title>
  <desc id="desc">A clean, flat vector illustration of a cute sitting red panda with white eyebrow arches, black ears with white inner arcs, and a striped tail.</desc>

  <!-- Color Definitions matching the reference flat vector artwork -->
  <defs>
    <style>
      .orange-fur { fill: #EE5326; }
      .dark-fur { fill: #111111; }
      .white-fur { fill: #FFFFFF; }
      .blush-pink { fill: #FF8585; opacity: 0.55; }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="180" cy="358" rx="100" ry="8" fill="#C29A88" opacity="0.6"/>

  <!-- Tail Layer (#tail: animated sway/idle) -->
  <g id="tail">
    <!-- Fluffy curved striped tail on the left side -->
    <path d="M125 240 C50 220 20 280 45 320 C65 352 135 340 148 290 C155 265 140 245 125 240 Z" fill="#EE5326"/>
    
    <!-- White Tail Tip & White Stripes -->
    <path d="M42 225 C40 205 68 185 85 208 C70 215 50 220 42 225 Z" fill="#FFFFFF"/>
    <path d="M38 275 C24 250 52 230 78 250 C60 262 44 270 38 275 Z" fill="#FFFFFF"/>
    <path d="M52 315 C38 295 72 272 100 288 C82 302 62 310 52 315 Z" fill="#FFFFFF"/>
    <path d="M85 342 C68 330 102 308 128 320 C110 335 94 340 85 342 Z" fill="#FFFFFF"/>
  </g>

  <!-- Ears Layer (#ears: animated twitch) -->
  <g id="ears">
    <!-- LEFT EAR: Solid black outer ear with white crescent inner arc -->
    <path d="M72 130 C45 65 92 45 142 90 C118 108 95 122 72 130 Z" fill="#111111"/>
    <path d="M84 120 C62 78 96 62 130 96 C114 108 96 116 84 120 Z" fill="#FFFFFF"/>

    <!-- RIGHT EAR: Solid black outer ear with white crescent inner arc -->
    <path d="M288 130 C315 65 268 45 218 90 C242 108 265 122 288 130 Z" fill="#111111"/>
    <path d="M276 120 C298 78 264 62 230 96 C246 108 264 116 276 120 Z" fill="#FFFFFF"/>
  </g>

  <!-- Body Layer (#body: sitting pose with black chest & white oval belly) -->
  <g id="body">
    <!-- Outer Lower Body (Orange back & sides) -->
    <path d="M110 190 C92 220 85 310 105 340 C125 360 235 360 255 340 C275 310 268 220 250 190 Z" fill="#EE5326"/>

    <!-- Solid Black Upper Chest & Collar -->
    <path d="M125 185 C120 220 140 245 180 248 C220 245 240 220 235 185 C210 210 150 210 125 185 Z" fill="#111111"/>

    <!-- Crisp White Belly Oval -->
    <path d="M142 225 C135 270 142 328 180 330 C218 328 225 270 218 225 C195 242 165 242 142 225 Z" fill="#FFFFFF"/>

    <!-- Solid Black Feet & Legs sitting on ground -->
    <!-- Left Leg -->
    <path d="M122 255 C108 275 105 330 115 348 C130 355 158 355 162 342 C165 320 150 270 142 255 Z" fill="#111111"/>
    <!-- Right Leg -->
    <path d="M238 255 C252 275 255 330 245 348 C230 355 202 355 198 342 C195 320 210 270 218 255 Z" fill="#111111"/>
  </g>

  <!-- Paws Layer (#paws: orange arms with black hands/claws) -->
  <g id="paws">
    <!-- Left Arm (Orange) -->
    <path d="M120 195 C105 220 110 265 142 270 C155 270 162 258 152 245 C138 230 130 212 120 195 Z" fill="#EE5326"/>
    <!-- Left Paw (Solid Black with white claws) -->
    <ellipse cx="148" cy="256" rx="14" ry="16" fill="#111111" transform="rotate(-15 148 256)"/>
    <!-- White Claws -->
    <path d="M142 264 L140 270 M148 266 L148 272 M154 264 L156 270" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Arm (Orange) -->
    <path d="M240 195 C255 220 250 265 218 270 C205 270 198 258 208 245 C222 230 230 212 240 195 Z" fill="#EE5326"/>
    <!-- Right Paw (Solid Black with white claws) -->
    <ellipse cx="212" cy="256" rx="14" ry="16" fill="#111111" transform="rotate(15 212 256)"/>
    <!-- White Claws -->
    <path d="M206 264 L204 270 M212 266 L212 272 M218 264 L220 270" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Head Layer (#head: flat orange head, spiky hair, white eyebrow arches, brown eye-patches) -->
  <g id="head">
    <!-- Orange Head Base -->
    <path d="M82 145 C70 102 100 55 180 55 C260 55 290 102 278 145 C270 180 240 205 180 205 C120 205 90 180 82 145 Z" fill="#EE5326"/>

    <!-- Spiky Fur Tuft on top of Head between ears (exactly like reference image) -->
    <path d="M155 58 L168 45 L176 56 L188 42 L196 58 Z" fill="#EE5326"/>

    <!-- Wide White Eyebrow Arches / Eyemask (Signature feature from reference image!) -->
    <path d="M92 152 C82 118 105 82 180 82 C255 82 278 118 268 152 C250 120 215 98 180 98 C145 98 110 120 92 152 Z" fill="#FFFFFF"/>

    <!-- Dark Auburn/Brown Cheek Patches under eyes -->
    <path d="M104 158 C96 178 115 200 138 202 C152 200 156 182 146 168 C132 160 118 158 104 158 Z" fill="#C43812"/>
    <path d="M256 158 C264 178 245 200 222 202 C208 200 204 182 214 168 C228 160 242 158 256 158 Z" fill="#C43812"/>

    <!-- White Muzzle & Snout Base -->
    <path d="M136 162 C130 185 145 205 180 205 C215 205 230 185 224 162 C210 170 195 174 180 174 C165 174 150 170 136 162 Z" fill="#FFFFFF"/>
  </g>

  <!-- Empty Headphones Group for compatibility (#headphones) -->
  <g id="headphones"/>

  <!-- Eyes Layer (#eyes: interactive pupil tracking & blinking) -->
  <g id="eyes">
    <!-- Outer Eye Sockets -->
    <circle cx="138" cy="148" r="16" fill="#111111"/>
    <circle cx="222" cy="148" r="16" fill="#111111"/>

    <!-- Left Pupil (#left-eye) -->
    <g id="left-eye">
      <circle cx="138" cy="148" r="15" fill="#111111"/>
      <!-- Glossy White Highlight Circle -->
      <circle cx="133" cy="142" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Right Pupil (#right-eye) -->
    <g id="right-eye">
      <circle cx="222" cy="148" r="15" fill="#111111"/>
      <!-- Glossy White Highlight Circle -->
      <circle cx="217" cy="142" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Eyelids for Blink Animation (#eyelids) -->
    <g id="eyelids" fill="#FFFFFF" opacity="0">
      <circle cx="138" cy="148" r="17"/>
      <circle cx="222" cy="148" r="17"/>
      <path d="M120 148 Q138 162 156 148" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
      <path d="M204 148 Q222 162 240 148" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Blush Layer (#blush) -->
  <g id="blush">
    <ellipse cx="112" cy="172" rx="10" ry="6" class="blush-pink"/>
    <ellipse cx="248" cy="172" rx="10" ry="6" class="blush-pink"/>
  </g>

  <!-- Nose & Mouth Layer (#face) -->
  <g id="face" stroke-linecap="round">
    <!-- Black Nose -->
    <ellipse cx="180" cy="164" rx="8" ry="6" fill="#111111"/>
    <ellipse cx="178" cy="162" rx="2.5" ry="1.5" fill="#FFFFFF" opacity="0.8"/>

    <!-- Simple :3 Smile Lines (matching reference image) -->
    <path d="M180 170 V173" stroke="#111111" stroke-width="2.5"/>
    <path d="M168 174 C174 180 180 178 180 173 C180 178 186 180 192 174" fill="none" stroke="#111111" stroke-width="2.5"/>
  </g>
</svg>
